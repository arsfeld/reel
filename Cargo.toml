[package]
name = "reel"
version = "0.1.0"
edition = "2024"
authors = ["Alexandre Rosenfeld <alex@rosenfeld.one>"]
license = "GPL-3.0-or-later"
description = "A modern, native media player for the Linux desktop"

[dependencies]
# UI
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }

# Video backend (GStreamer)
gst = { version = "0.25", package = "gstreamer" }
gst-video = { version = "0.25", package = "gstreamer-video" }

# HTTP + serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
diesel = { version = "2.3.9", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3"
# Declared directly so the `bundled` feature compiles SQLite from source
# (diesel doesn't enable bundling itself); no system libsqlite needed.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

# Crypto (artwork cache keys)
sha2 = "0.10"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System
libc = "0.2"
futures = "0.3.32"
mpris-server = "0.9.0"

[dev-dependencies]
axum = "0.8"
mockall = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["net"] }
wiremock = "0.6"

[features]
integration = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

[lints.rust]
warnings = "deny"
