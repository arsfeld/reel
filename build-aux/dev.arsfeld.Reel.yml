app-id: dev.arsfeld.Reel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: reel

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network — talks to Plex (and other media servers) over HTTP(S).
  - --share=network
  # Audio
  - --socket=pulseaudio
  # Hardware video acceleration via VA-API
  - --device=dri
  # Persist app config + cache outside the sandbox
  - --filesystem=xdg-config/reel:create
  - --filesystem=xdg-cache/reel:create

# The freedesktop 25.08 runtime (which GNOME 50 is built on) ships gst-libav
# but NOT the patent-encumbered codec libraries it links against (libavcodec,
# libx264, libx265, libde265, …). Pull them in via the codecs-extra extension
# so playback works for H.264 / H.265 / AAC / AC-3 / etc.
add-extensions:
  org.freedesktop.Platform.codecs-extra:
    version: '25.08-extra'
    directory: lib/codecs-extra
    add-ld-path: lib
    no-autodownload: false
    autodelete: true

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Cargo needs to fetch crates from crates.io during the build. This
    # is allowed in personal/CI builds; Flathub submissions would have to
    # vendor sources offline (see flatpak-cargo-generator).
    - --share=network
  env:
    CARGO_HOME: /run/build/reel/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: reel
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --manifest-path Cargo.toml
      - install -Dm755 target/release/reel /app/bin/reel
      # Mountpoint for the codecs-extra extension declared at the top level.
      # Must exist at install time or flatpak refuses to mount the extension.
      - install -dm755 /app/lib/codecs-extra
      - install -Dm644 data/dev.arsfeld.Reel.desktop
        /app/share/applications/dev.arsfeld.Reel.desktop
      - install -Dm644 data/dev.arsfeld.Reel.metainfo.xml
        /app/share/metainfo/dev.arsfeld.Reel.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/dev.arsfeld.Reel.svg
        /app/share/icons/hicolor/scalable/apps/dev.arsfeld.Reel.svg
    sources:
      - type: dir
        path: ..
        skip:
          # .cargo/config.toml forces a clang + mold linker for the Nix dev
          # shell; the flatpak SDK has neither, so build with cargo defaults.
          - .cargo
          - .git
          - .jj
          - target
          - .direnv
          - .env
          - .github
          - .reasonix
          - .claude
          - result
