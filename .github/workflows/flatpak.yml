name: Flatpak

on:
  push:
    branches: [main, master, reel-ng]
    tags: ['v*']
  pull_request:
    branches: [main, master, reel-ng]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      # Matches runtime-version: '50' in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reel.flatpak
          manifest-path: build-aux/dev.arsfeld.Reel.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'build-aux/dev.arsfeld.Reel.yml') }}
          # Run appstream + desktop file validation as part of the build.
          verbose: false

  release:
    name: Attach bundle to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          # flatpak-builder appends the arch to the artifact name
          # (`<bundle-basename>-<arch>.flatpak`); the file inside is
          # still `reel.flatpak`.
          name: reel-x86_64.flatpak

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: reel.flatpak
          generate_release_notes: true
